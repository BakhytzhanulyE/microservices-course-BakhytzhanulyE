openapi: 3.0.3

info:
  title: OrderService API
  description: |
    HTTP API сервиса заказов. Точка входа всей системы: клиент собирает заказ
    из деталей каталога, оплачивает его и получает уведомление, когда корабль собран.

    Внутри order ходит в inventory и payment по gRPC, а факт оплаты публикует
    в Kafka — этого в контракте не видно, и это правильно.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Локальный запуск

paths:
  /health:
    get:
      summary: Проверка живости сервиса
      operationId: health
      responses:
        '200':
          description: Сервис работает
          content:
            text/plain:
              schema:
                type: string
                example: OK

  /api/v1/orders:
    post:
      summary: Создать заказ
      description: |
        Проверяет каждую деталь в каталоге, считает сумму и создаёт заказ
        в статусе `PENDING_PAYMENT`. Повторяющиеся UUID деталей учитываются один раз.
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Заказ создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderResponse'
        '400':
          description: Некорректное тело запроса или деталь отсутствует в каталоге
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Каталог деталей недоступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/orders/{order_uuid}:
    get:
      summary: Получить заказ
      operationId: getOrder
      parameters:
        - $ref: '#/components/parameters/OrderUUID'
      responses:
        '200':
          description: Заказ найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Заказа с таким UUID нет
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/orders/{order_uuid}/pay:
    post:
      summary: Оплатить заказ
      description: |
        Оплатить можно только заказ в статусе `PENDING_PAYMENT`.
        Повторная оплата и оплата отменённого заказа отвечают 409.
      operationId: payOrder
      parameters:
        - $ref: '#/components/parameters/OrderUUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayOrderRequest'
      responses:
        '200':
          description: Оплата прошла
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayOrderResponse'
        '400':
          description: Некорректное тело запроса или неизвестный способ оплаты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Заказа с таким UUID нет
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Заказ уже не ждёт оплаты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Платёжный сервис не смог провести оплату
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/orders/{order_uuid}/cancel:
    post:
      summary: Отменить заказ
      description: Отменить можно только неоплаченный заказ.
      operationId: cancelOrder
      parameters:
        - $ref: '#/components/parameters/OrderUUID'
      responses:
        '204':
          description: Заказ отменён
        '404':
          description: Заказа с таким UUID нет
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Заказ уже оплачен или уже отменён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  parameters:
    OrderUUID:
      name: order_uuid
      in: path
      required: true
      description: UUID заказа
      schema:
        type: string
        format: uuid

  schemas:
    CreateOrderRequest:
      type: object
      required: [ user_uuid, part_uuids ]
      properties:
        user_uuid:
          type: string
          format: uuid
        part_uuids:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid

    CreateOrderResponse:
      type: object
      required: [ order_uuid, total_price ]
      properties:
        order_uuid:
          type: string
          format: uuid
        total_price:
          type: number
          format: double

    PayOrderRequest:
      type: object
      required: [ payment_method ]
      properties:
        payment_method:
          type: string
          enum: [ CARD, SBP, CREDIT_CARD, INVESTOR_MONEY ]

    PayOrderResponse:
      type: object
      required: [ transaction_uuid ]
      properties:
        transaction_uuid:
          type: string
          format: uuid

    Order:
      type: object
      required: [ order_uuid, user_uuid, part_uuids, total_price, status, created_at ]
      properties:
        order_uuid:
          type: string
          format: uuid
        user_uuid:
          type: string
          format: uuid
        part_uuids:
          type: array
          items:
            type: string
            format: uuid
        total_price:
          type: number
          format: double
        transaction_uuid:
          type: string
          format: uuid
        payment_method:
          type: string
        status:
          type: string
          enum: [ PENDING_PAYMENT, PAID, CANCELLED ]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Error:
      type: object
      required: [ code, message ]
      properties:
        code:
          type: integer
        message:
          type: string
