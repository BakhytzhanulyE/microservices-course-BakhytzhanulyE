syntax = "proto3";

package inventory.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/BakhytzhanulyE/microservices-course-BakhytzhanulyE/shared/pkg/proto/inventory/v1;inventory_v1";

// InventoryService — каталог деталей для сборки космических кораблей.
service InventoryService {
  // GetPart возвращает одну деталь по её UUID.
  rpc GetPart(GetPartRequest) returns (GetPartResponse);

  // ListParts возвращает список деталей, подходящих под фильтр.
  rpc ListParts(ListPartsRequest) returns (ListPartsResponse);
}

// Category — категория детали.
enum Category {
  // CATEGORY_UNSPECIFIED — категория не указана.
  CATEGORY_UNSPECIFIED = 0;
  // CATEGORY_ENGINE — двигатель.
  CATEGORY_ENGINE = 1;
  // CATEGORY_FUEL — топливо.
  CATEGORY_FUEL = 2;
  // CATEGORY_PORTHOLE — иллюминатор.
  CATEGORY_PORTHOLE = 3;
  // CATEGORY_WING — крыло.
  CATEGORY_WING = 4;
}

// Dimensions — габариты и вес детали.
message Dimensions {
  // Длина в сантиметрах.
  double length = 1;
  // Ширина в сантиметрах.
  double width = 2;
  // Высота в сантиметрах.
  double height = 3;
  // Вес в килограммах.
  double weight = 4;
}

// Manufacturer — производитель детали.
message Manufacturer {
  // Название производителя.
  string name = 1;
  // Страна производителя.
  string country = 2;
  // Сайт производителя.
  string website = 3;
}

// StringList — список строк, нужен для метаданных.
message StringList {
  // Значения.
  repeated string values = 1;
}

// Value — значение произвольного типа в метаданных детали.
message Value {
  // Одно из возможных значений.
  oneof kind {
    // Строка.
    string string_value = 1;
    // Целое число.
    int64 int64_value = 2;
    // Число с плавающей точкой.
    double double_value = 3;
    // Логическое значение.
    bool bool_value = 4;
    // Список строк.
    StringList string_list = 5;
  }
}

// Part — деталь космического корабля.
message Part {
  // Уникальный идентификатор детали.
  string uuid = 1;
  // Название детали.
  string name = 2;
  // Описание детали.
  string description = 3;
  // Цена за единицу.
  double price = 4;
  // Количество на складе.
  int64 stock_quantity = 5;
  // Категория детали.
  Category category = 6;
  // Габариты детали.
  Dimensions dimensions = 7;
  // Производитель детали.
  Manufacturer manufacturer = 8;
  // Теги для поиска.
  repeated string tags = 9;
  // Произвольные метаданные.
  map<string, Value> metadata = 10;
  // Время создания записи.
  google.protobuf.Timestamp created_at = 11;
  // Время последнего обновления записи.
  google.protobuf.Timestamp updated_at = 12;
}

// PartsFilter — фильтр для выборки деталей. Пустой фильтр возвращает всё.
message PartsFilter {
  // Список UUID деталей.
  repeated string uuids = 1;
  // Список названий деталей.
  repeated string names = 2;
  // Список категорий.
  repeated Category categories = 3;
  // Список стран производителей.
  repeated string manufacturer_countries = 4;
  // Список тегов.
  repeated string tags = 5;
}

// GetPartRequest — запрос детали по UUID.
message GetPartRequest {
  // UUID детали.
  string uuid = 1;
}

// GetPartResponse — ответ с найденной деталью.
message GetPartResponse {
  // Найденная деталь.
  Part part = 1;
}

// ListPartsRequest — запрос списка деталей.
message ListPartsRequest {
  // Фильтр выборки.
  PartsFilter filter = 1;
}

// ListPartsResponse — ответ со списком деталей.
message ListPartsResponse {
  // Найденные детали.
  repeated Part parts = 1;
}
