name: Test Reusable

on:
  workflow_call:
    inputs:
      modules:
        required: true
        type: string
      go-version:
        required: true
        type: string

jobs:
  go-test:
    name: Build and test all Go modules
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v7.0.1

      - name: 🛠 Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ inputs.go-version }}

      - name: 📌 Install Task
        uses: arduino/setup-task@v3.0.0

      - name: 🔨 Build all modules
        env:
          MODULES: ${{ inputs.modules }}
        run: task build

      - name: 🧪 Run tests with race detector
        env:
          MODULES: ${{ inputs.modules }}
        run: task test
