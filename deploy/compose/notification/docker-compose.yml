# Уведомления: читает order.paid и ship.assembled, шлёт сообщения в Telegram.
services:

  notification:
    build:
      context: ../../..
      dockerfile: notification/Dockerfile
    container_name: notification
    env_file:
      - .env
    environment:
      KAFKA_BROKERS: kafka:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
    ports:
      - "${METRICS_PORT}:${METRICS_PORT}"
    restart: unless-stopped
    networks:
      - microservices-net

networks:
  microservices-net:
    external: true
