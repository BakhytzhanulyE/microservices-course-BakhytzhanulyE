# Сборочный цех: читает order.paid, пишет ship.assembled.
services:

  assembly:
    build:
      context: ../../..
      dockerfile: assembly/Dockerfile
    container_name: assembly
    env_file:
      - .env
    environment:
      KAFKA_BROKERS: kafka:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
    ports:
      - "${METRICS_PORT}:${METRICS_PORT}"
    restart: unless-stopped
    networks:
      - microservices-net

networks:
  microservices-net:
    external: true
