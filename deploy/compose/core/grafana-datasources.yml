# Источники данных прописаны заранее, чтобы после `task up-core`
# в Grafana сразу были и метрики, и трейсы.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
